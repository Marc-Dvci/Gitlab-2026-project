# Joule Thief — the post-code lifecycle, scheduled by the grid.
#
# Pipeline sources:
#   merge requests / default branch  -> verify, test (scanners), secure, package, release, monitor, govern
#   schedule JOULE_TASK=tick         -> the hands-off dispatcher (every 30 min if you don't use Cloud Scheduler)
#   schedule JOULE_TASK=plan         -> tick + publish the dispatch plan as an issue
#   schedule JOULE_TASK=eco          -> demand shaping: flip the eco-mode feature flag from the grid signal
#   api JOULE_TASK=heavy-tests|heavy-scan -> deferred heavy work, started by the dispatcher in a clean window
#
# Required CI/CD variables (Settings > CI/CD > Variables), all optional until you deploy:
#   JOULE_GITLAB_TOKEN   project access token (api) — dispatcher, footprint accounting, flags, issues
#   GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_REGION (europe-north1), GCP_AR_REPO
#   JOULE_FLOW_CONSUMER_ID   AI Catalog consumer id of the "surge-worker" flow
#   JOULE_REVIEWER_CONSUMER_ID   AI Catalog consumer id of the "carbon-reviewer" flow (started on energy regressions)
#   JOULE_CONTROL_ID, JOULE_CONTROL_SECRET   compliance external control (Ultimate)

workflow:
  auto_cancel:
    on_new_commit: interruptible  # superseded pipelines stop burning energy
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|api|web|trigger)$/

stages: [plan, verify, test, secure, package, release, configure, monitor, govern]

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GCP_REGION: europe-north1
  JOULE_PREDICATE_TYPE: "urn:joulethief:carbon-receipt:v1"
  IMAGE: $CI_REGISTRY_IMAGE/app
  SERVICE: joule-thief

default:
  image: python:3.12-slim
  interruptible: true
  cache:
    key:
      files: [requirements.txt, requirements-dev.txt]
    paths: [.cache/pip]

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

.code-pipeline:
  rules:
    - if: $JOULE_TASK
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.default-branch:  # receipts and gates are for artifacts that can be deployed, not for every MR image
  rules:
    - if: $JOULE_TASK
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.main-only:
  rules:
    - if: $JOULE_TASK
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_WIF_PROVIDER

.gcp:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - export ACCESS_TOKEN="$(sh scripts/gcp_token.sh)"

# ─────────────────────────────── plan ───────────────────────────────
plan:dispatch:
  stage: plan
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $JOULE_TASK =~ /^(tick|plan)$/
  script:
    - pip install -q -r requirements.txt
    - python -m joulethief.cli tick $([ "$JOULE_TASK" = "plan" ] && echo --publish-plan)

plan:eco-mode:
  stage: plan
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $JOULE_TASK == "eco"
  script:
    - python -m joulethief.cli eco --region "$GCP_REGION"  # stdlib only: no install needed

# ─────────────────────────────── verify ───────────────────────────────
verify:test:
  stage: verify
  extends: .code-pipeline
  script:
    - pip install -q -r requirements-dev.txt
    - python -m pytest -q --junitxml=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml

verify:energy:
  stage: verify
  rules:  # MRs measure only when they change code that serves requests; main always keeps the baseline
    - if: $JOULE_TASK
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [app/**/*, joulethief/**/*, scripts/energy_benchmark.py, requirements.txt, requirements-dev.txt]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - pip install -q -r requirements-dev.txt
    - python scripts/energy_benchmark.py
    # Deterministic MR note with J/request vs the target branch; the Carbon Reviewer agent is started
    # only when energy per request regresses or the MR edits one of the hottest lines.
    - |
      if [ -n "${JOULE_GITLAB_TOKEN:-}" ] && [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        python -m joulethief.cli energy-gate --benchmark benchmark.json
      fi
  artifacts:
    expose_as: "Carbon blame"
    paths: [carbon-blame.md, benchmark.json, metrics.txt]
    reports:
      metrics: metrics.txt  # MR widget shows joules/request vs the target branch

verify:heavy-tests:  # deferred work: started by the dispatcher when the grid has surplus
  stage: verify
  rules:
    - if: $JOULE_TASK == "heavy-tests"
  parallel:
    matrix:
      - PYTHON: ["3.11", "3.12", "3.13"]
  image: python:${PYTHON}-slim
  script:
    - pip install -q -r requirements-dev.txt
    - python -m pytest -q
    - python experiments/autonomy_dividend.py
  artifacts:
    paths: [docs/results/]

# ─────────────────────────────── test / secure (GitLab scanners) ───────────────────────────────
secret_detection:
  stage: secure

secure:heavy-scan-marker:  # DAST and fuzzing stay off the critical path; the dispatcher runs them in clean windows
  stage: secure
  rules:
    - if: $JOULE_TASK == "heavy-scan"
  script:
    - echo "Deferred security scan for issue ${JOULE_ISSUE:-n/a} in ${JOULE_REGION:-default} (window chosen by the grid)."
    - pip install -q -r requirements-dev.txt bandit
    - bandit -q -r joulethief app -f json -o bandit.json || true
  artifacts:
    paths: [bandit.json]

# ─────────────────────────────── package ───────────────────────────────
package:image:
  stage: package
  extends: .code-pipeline
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build --pull -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$CI_COMMIT_SHORT_SHA" | cut -d@ -f2)
    - echo "IMAGE_DIGEST=$DIGEST" > build.env
    - |
      if [ -n "${GCP_WIF_PROVIDER:-}" ] && [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        apk add --no-cache curl >/dev/null
        AR="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_AR_REPO}/app"
        sh scripts/gcp_token.sh | docker login -u oauth2accesstoken --password-stdin "${GCP_REGION}-docker.pkg.dev"
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$AR:$CI_COMMIT_SHORT_SHA"
        docker push "$AR:$CI_COMMIT_SHORT_SHA"
        echo "AR_IMAGE=$AR" >> build.env
      fi
  artifacts:
    reports:
      dotenv: build.env

container_scanning:
  stage: package
  needs: [package:image]
  variables:
    CS_IMAGE: $IMAGE:$CI_COMMIT_SHORT_SHA
  rules:
    - if: $JOULE_TASK
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─────────────────────────────── release ───────────────────────────────
release:receipt:
  stage: release
  extends: .default-branch
  image: alpine:3.20
  needs: [package:image, verify:energy]
  variables:
    COSIGN_YES: "true"
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - apk add --no-cache cosign python3 >/dev/null
    - |
      if [ -n "${JOULE_GITLAB_TOKEN:-}" ]; then
        python3 -m joulethief.cli pipeline-footprint --ledger ledger.jsonl --summary footprint-summary.json
      else
        python3 -m joulethief.cli ci-energy --region us-east1 --minutes 10 --ledger ledger.jsonl
      fi
    - python3 -m joulethief.cli receipt build --subject "$IMAGE" --digest "$IMAGE_DIGEST" --ledger ledger.jsonl --out receipt.predicate.json
    - cosign login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - cosign sign "$IMAGE@$IMAGE_DIGEST"
    - cosign attest --type "$JOULE_PREDICATE_TYPE" --predicate receipt.predicate.json "$IMAGE@$IMAGE_DIGEST"
  artifacts:
    paths: [receipt.predicate.json, ledger.jsonl]

release:verify-receipt:  # the gate: no valid, within-budget carbon receipt -> no deploy
  stage: release
  extends: .default-branch
  image: alpine:3.20
  needs: [package:image, release:receipt]
  script:
    - apk add --no-cache cosign python3 >/dev/null
    - cosign login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - >
      cosign verify-attestation --type "$JOULE_PREDICATE_TYPE"
      --certificate-identity "${CI_PROJECT_URL}//.gitlab-ci.yml@refs/heads/${CI_COMMIT_REF_NAME}"
      --certificate-oidc-issuer "${CI_SERVER_URL}" "$IMAGE@$IMAGE_DIGEST" > attestation.json
    - head -n1 attestation.json > envelope.json
    - python3 -m joulethief.cli receipt verify --statement envelope.json --digest "$IMAGE_DIGEST"

release:canary:
  stage: release
  extends: [.gcp, .main-only]
  image: google/cloud-sdk:slim
  needs: [package:image, release:verify-receipt]
  environment:
    name: production
    action: prepare
  script:
    - echo "$ACCESS_TOKEN" > token.txt
    - >
      gcloud run deploy "$SERVICE" --access-token-file=token.txt --project "$GCP_PROJECT_ID" --region "$GCP_REGION"
      --image "$AR_IMAGE@$IMAGE_DIGEST" --no-traffic --tag "c-$CI_COMMIT_SHORT_SHA" --quiet
    - gcloud run services describe "$SERVICE" --access-token-file=token.txt --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format json > service.json
    - export TAG="c-$CI_COMMIT_SHORT_SHA"
    - CANARY=$(python3 -c 'import json,os; d=json.load(open("service.json")); print(next((t["url"] for t in d["status"].get("traffic", []) if t.get("tag") == os.environ["TAG"]), ""))')
    - PROD=$(python3 -c 'import json; print(json.load(open("service.json"))["status"]["url"])')
    - echo "CANARY_URL=${CANARY:-$PROD}" > deploy.env && echo "PROD_URL=$PROD" >> deploy.env
  artifacts:
    reports:
      dotenv: deploy.env

# ─────────────────────────────── configure ───────────────────────────────
configure:validate:
  stage: configure
  image:
    name: ghcr.io/opentofu/opentofu:1.8
    entrypoint: [""]
  rules:
    - if: $JOULE_TASK
      when: never
    - changes: [infra/terraform/**/*]
  script:
    - cd infra/terraform
    - tofu fmt -check -recursive
    - tofu init -backend=false -input=false
    - tofu validate

configure:infra:
  stage: configure
  extends: .gcp
  image:
    name: ghcr.io/opentofu/opentofu:1.8
    entrypoint: [""]
  rules:
    - if: $JOULE_TASK
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_WIF_PROVIDER
      changes: [infra/terraform/**/*]
  variables:
    TF_ADDRESS: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/production
  script:
    - export GOOGLE_OAUTH_ACCESS_TOKEN="$ACCESS_TOKEN"
    - cd infra/terraform
    - >
      tofu init -input=false -backend-config=address=${TF_ADDRESS} -backend-config=lock_address=${TF_ADDRESS}/lock
      -backend-config=unlock_address=${TF_ADDRESS}/lock -backend-config=username=gitlab-ci-token
      -backend-config=password=${CI_JOB_TOKEN} -backend-config=lock_method=POST -backend-config=unlock_method=DELETE
    - tofu apply -input=false -auto-approve -var "project_id=$GCP_PROJECT_ID" -var "gitlab_project_path=$CI_PROJECT_PATH"

# ─────────────────────────────── monitor ───────────────────────────────
monitor:canary-energy:  # an energy regression is a bug: the canary is promoted only if it is not hungrier
  stage: monitor
  extends: .main-only
  needs: [release:canary]
  script:
    - python scripts/canary_check.py "$CANARY_URL" "$PROD_URL" --tolerance 0.15
  artifacts:
    when: always
    paths: [canary-report.json]

monitor:promote:
  stage: monitor
  extends: [.gcp, .main-only]
  image: google/cloud-sdk:slim
  needs: [release:canary, monitor:canary-energy]
  environment:
    name: production
    url: $DYNAMIC_ENVIRONMENT_URL
  script:
    - echo "$ACCESS_TOKEN" > token.txt
    - gcloud run services update-traffic "$SERVICE" --to-latest --access-token-file=token.txt --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet
    - echo "DYNAMIC_ENVIRONMENT_URL=$PROD_URL" > promote.env
  artifacts:
    reports:
      dotenv: promote.env

release:gitlab-release:
  stage: monitor
  extends: .main-only
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [monitor:promote, release:receipt]
  script:
    - echo "Releasing $CI_COMMIT_SHORT_SHA with its carbon receipt"
  release:
    tag_name: v0.1.$CI_PIPELINE_IID
    name: Joule Thief $CI_COMMIT_SHORT_SHA
    description: "Deployed to Cloud Run ($GCP_REGION). Carbon receipt attested on $IMAGE@$IMAGE_DIGEST (cosign verify-attestation --type $JOULE_PREDICATE_TYPE)."

# ─────────────────────────────── govern ───────────────────────────────
govern:footprint:  # one job accounts for every job of the pipeline (retries included) via the API
  stage: govern
  rules:
    - if: $JOULE_GITLAB_TOKEN && $JOULE_TASK == null
      when: always
  script:
    - python -m joulethief.cli pipeline-footprint --ledger pipeline-ledger.jsonl --summary footprint-summary.json
    - |
      if [ -n "${JOULE_CONTROL_ID:-}" ] && [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        python -m joulethief.cli control --ledger pipeline-ledger.jsonl
      fi
    # Close the loop on the delivered issues with their carbon balance: a script, not an LLM —
    # the numbers are copied from this pipeline's artifacts, so there is nothing to generate.
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        python -m joulethief.cli shipped --summary footprint-summary.json
      fi
  artifacts:
    when: always
    expire_in: 1 year
    paths: [pipeline-ledger.jsonl, footprint-summary.json]
