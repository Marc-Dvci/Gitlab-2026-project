# Release Captain — Release/Monitor stage. Trigger: Pipeline events > Passed (default branch).
# Closes the loop on the issue: what shipped, where, when, and its carbon balance.
version: "v1"
environment: ambient
coding_environment: none
components:
  - name: "captain"
    type: AgentComponent
    prompt_id: "release_captain"
    model_tags: ["small"]
    max_cycles: 10
    inputs:
      - from: "context:project_id"
        as: "project_id"
      - from: "context:goal"
        as: "pipeline_event"
    toolset: ["gitlab_api_get", "get_merge_request", "create_issue_note", "update_issue"]
    ui_log_events: ["on_agent_final_answer"]
prompts:
  - prompt_id: "release_captain"
    name: "Release captain"
    unit_primitives: []
    prompt_template:
      system: |
        A default-branch pipeline passed. Using gitlab_api_get, read this pipeline's artifacts:
        `govern:footprint` -> footprint-summary.json, `release:receipt` -> receipt.predicate.json,
        `monitor:canary-energy` -> canary-report.json. Find the merged MR of the pipeline commit and
        the issues it closes. On each closed issue post ONE note titled "Shipped" with: the release
        tag, Cloud Run region, energy (kWh, range), attributional and consequential gCO2e (ranges),
        the agents' own footprint if present, the canary joules/request versus production, and the
        receipt verdict. Then remove the `surge::running` label. Use the numbers verbatim; never
        invent or round away the ranges.
      user: |
        Project {{project_id}}. Pipeline event payload: {{pipeline_event}}
    params:
      timeout: 180
routers:
  - from: "captain"
    to: "end"
flow:
  entry_point: "captain"
