[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "joulethief"
version = "0.1.0"
description = "Joule Thief: hands-off agents that run the post-code lifecycle on the energy the grid throws away."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dispatch = ["ortools>=9.10"]
llm = ["ecologits>=0.11"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "mcp>=1.2"]
dev = ["pytest>=8", "ortools>=9.10", "ecologits>=0.11", "fastapi>=0.110", "uvicorn>=0.29", "mcp>=1.2", "httpx>=0.27"]

[project.scripts]
joule = "joulethief.cli:main"

[tool.setuptools.packages.find]
include = ["joulethief*", "app*"]

[tool.setuptools.package-data]
joulethief = ["data/*.yaml", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
